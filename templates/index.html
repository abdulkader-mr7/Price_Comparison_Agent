{% extends "base.html" %}

{% block content %}
<div class="relative overflow-hidden bg-brand-900 pb-32">
    <div class="absolute inset-0">
        <img class="h-full w-full object-cover opacity-20" src="https://images.unsplash.com/photo-1557821552-17105176677c?ixlib=rb-4.0.3&auto=format&fit=crop&w=2089&q=80" alt="Background">
        <div class="absolute inset-0 bg-gradient-to-t from-brand-900 to-transparent"></div>
    </div>
    <div class="relative max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8 flex flex-col items-center pt-24">
        <h1 class="text-4xl font-extrabold tracking-tight text-white sm:text-5xl lg:text-6xl text-center mb-6 drop-shadow-lg">
            Compare Prices <span class="text-brand-500">Instantly</span>
        </h1>
        <p class="mt-4 max-w-2xl text-xl text-brand-100 text-center mb-10">
            Track and compare products across Amazon, Flipkart, and Meesho in one click.
        </p>
        
        <div class="w-full max-w-2xl relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-brand-500 to-purple-600 rounded-lg blur opacity-50 group-hover:opacity-100 transition duration-1000 group-hover:duration-200"></div>
            <div class="relative flex p-2 bg-white rounded-lg shadow-xl">
                <input type="text" id="searchInput" placeholder="Search for iPhone 15, Shoes, etc..." 
                    class="flex-1 p-4 text-lg outline-none text-gray-700 rounded-l-md placeholder-gray-400">
                <button onclick="searchProducts()" id="searchBtn"
                    class="bg-brand-600 hover:bg-brand-700 text-white font-bold py-3 px-8 rounded-md transition duration-300 flex items-center gap-2">
                    <i class="fas fa-search"></i> <span>Search</span>
                </button>
            </div>
        </div>
    </div>
</div>

<main class="-mt-24 relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-12">
    <div id="loading" class="hidden flex justify-center py-20">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-brand-500"></div>
    </div>

    <div id="resultsArea" class="hidden space-y-12">
        <!-- Results will be injected here -->
    </div>
</main>

<!-- Templates (Hidden) -->
<template id="sectionTemplate">
     <section class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100 p-6">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-gray-100">
            <h2 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-gray-900 to-gray-600 flex items-center gap-3">
                <img class="w-8 h-8 object-contain" src="" alt="Logo">
                <span class="platform-name">Platform</span>
            </h2>
            <span class="text-sm font-medium px-3 py-1 rounded-full bg-gray-100 text-gray-600 result-count">0 Results</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 products-grid">
            <!-- Products go here -->
        </div>
    </section>
</template>
{% endblock %}
